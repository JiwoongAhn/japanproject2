# 작은 화면(iPhone SE)에서 숫자 키패드가 確認 버튼을 가리지 않는지 눈으로 확인하는 전용 플로우.
#
# 왜 따로 필요한가:
#   6자리를 채우면 앱이 자동으로 확인해 화면이 넘어간다(2026-09-30 수정).
#   그래서 본 촬영 플로우로는 "키패드가 올라온 인증코드 화면"을 찍을 수 없다.
#   → 일부러 5자리만 넣어 키패드가 올라온 채로 멈춘 상태를 찍는다.
#
# 전제: shots_103_login.yaml 을 먼저 돌려 인증코드 화면에 와 있어야 한다(clearState 하지 않는다).
appId: com.jiwoongahn.unione
---
- assertVisible: "認証コードを入力"
- tapOn:
    below: "認証コードを入力"
- inputText: "12345"
- tapOn:
    text: "붙여넣기 허용|ペーストを許可|Allow Paste"
    optional: true
# 키패드가 올라온 상태에서 確認 버튼이 온전히 보여야 한다.
- takeScreenshot: 00c_otp_keypad_5digits
- assertVisible: "確認"
