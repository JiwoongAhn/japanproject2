# 2단계: 발급받은 인증코드로 로그인 → 수정한 화면들을 촬영한다.
# ⚠️ clearState 하지 않는다 (1단계에서 인증코드 입력 화면에 와 있는 상태를 이어받는다)
# 필요 env: OTP (관리자 API로 발급한 6자리 코드)
appId: com.jiwoongahn.unione
---
# 붙여넣기 허용 팝업은 앱이 클립보드를 읽을 때마다 다시 뜬다 → 사라질 때까지 허용
- repeat:
    times: 5
    commands:
      - runFlow:
          when:
            visible: "붙여넣기 허용"
          commands:
            - tapOn: "붙여넣기 허용"
- assertVisible: "認証コードを入力"
- tapOn:
    below: "認証コードを入力"
- inputText: ${OTP}
# Maestro 의 inputText 는 클립보드를 쓰므로 iOS 가 붙여넣기 허용을 묻는다 → 허용
- tapOn:
    text: "붙여넣기 허용|ペーストを許可|Allow Paste"
    optional: true
# 붙여넣기 허용 팝업은 앱이 클립보드를 읽을 때마다 다시 뜬다 → 사라질 때까지 허용
- repeat:
    times: 5
    commands:
      - runFlow:
          when:
            visible: "붙여넣기 허용"
          commands:
            - tapOn: "붙여넣기 허용"
# ⚠️ 작은 화면(SE)에서는 숫자 키패드가 確認 버튼을 거의 덮는다.
#    키패드를 내릴 수단이 없어(스크롤뷰 없음) 버튼의 보이는 윗부분을 좌표로 누른다.
- tapOn:
    point: "50%,63%"

# 통지 프리퍼미션(기기 1회) → 나중에
- extendedWaitUntil:
    visible: "あとで設定する"
    timeout: 60000
- tapOn: "あとで設定する"

# ── 1) 홈 + 하단 탭 4개 ──────────────────────────────────────────────────
- repeat:
    times: 3
    commands:
      - runFlow:
          when:
            visible: "Dismiss"
          commands:
            - tapOn: "Dismiss"
- extendedWaitUntil:
    visible: "今日のまとめ"
    timeout: 60000
- assertVisible: "ホーム"
- assertVisible: "時間割"
- assertVisible: "掲示板"
- assertVisible: "マイページ"
- takeScreenshot: 01_home
- scroll
- takeScreenshot: 02_home_scrolled

# ── 2) 課題 모달 열기 → 닫기 ────────────────────────────────────────────
- scrollUntilVisible:
    element: "今日のまとめ"
    direction: UP
    optional: true
- repeat:
    times: 3
    commands:
      - runFlow:
          when:
            visible: "Dismiss"
          commands:
            - tapOn: "Dismiss"
      - runFlow:
          when:
            visible: "今日のまとめ"
          commands:
            - tapOn: ".*課題.*"
- takeScreenshot: 03_assignment_modal
# 닫기(✕)로 빠져나올 수 있어야 한다 — 모달 전환의 핵심 확인 항목
- tapOn:
    point: "8%,9%"
- extendedWaitUntil:
    visible: "今日のまとめ"
    timeout: 20000
- takeScreenshot: 04_back_to_home

# ── 3) 時間割 ───────────────────────────────────────────────────────────
- tapOn: "時間割"
- runFlow:
    when:
      visible: "Dismiss"
    commands:
      - tapOn: "Dismiss"
- extendedWaitUntil:
    visible: ".*学期.*"
    timeout: 30000
- takeScreenshot: 05_timetable

# ── 4) 掲示板 ───────────────────────────────────────────────────────────
- tapOn: "掲示板"
- runFlow:
    when:
      visible: "Dismiss"
    commands:
      - tapOn: "Dismiss"
- extendedWaitUntil:
    visible: "掲示板"
    timeout: 30000
- takeScreenshot: 06_board

# ── 5) マイページ — 学校サイトの接続 / テスト通知 ───────────────────────
- tapOn: "マイページ"
- runFlow:
    when:
      visible: "Dismiss"
    commands:
      - tapOn: "Dismiss"
- extendedWaitUntil:
    visible: "マイページ"
    timeout: 30000
- takeScreenshot: 07_profile_top
- scrollUntilVisible:
    element: "学校サイトの接続"
    direction: DOWN
    timeout: 40000
- takeScreenshot: 08_profile_school_section
