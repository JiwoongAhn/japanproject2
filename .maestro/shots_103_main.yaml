# 2단계: 발급받은 인증코드로 로그인 → 수정한 화면들을 촬영한다.
# ⚠️ clearState 하지 않는다 (1단계에서 인증코드 입력 화면에 와 있는 상태를 이어받는다)
# 필요 env: OTP (관리자 API로 발급한 6자리 코드)
appId: com.jiwoongahn.unione
---
# 붙여넣기 허용 팝업은 앱이 클립보드를 읽을 때마다 다시 뜬다 → 사라질 때까지 허용
- repeat:
    times: 5
    commands:
      - runFlow:
          when:
            visible: "붙여넣기 허용"
          commands:
            - tapOn: "붙여넣기 허용"
- assertVisible: "認証コードを入力"
- tapOn:
    below: "認証コードを入力"
- inputText: ${OTP}
# Maestro 의 inputText 는 클립보드를 쓰므로 iOS 가 붙여넣기 허용을 묻는다 → 허용
- tapOn:
    text: "붙여넣기 허용|ペーストを許可|Allow Paste"
    optional: true
# 붙여넣기 허용 팝업은 앱이 클립보드를 읽을 때마다 다시 뜬다 → 사라질 때까지 허용
- repeat:
    times: 5
    commands:
      - runFlow:
          when:
            visible: "붙여넣기 허용"
          commands:
            - tapOn: "붙여넣기 허용"
# 키패드가 올라온 상태를 찍어 둔다 — 確認 버튼이 가려지지 않는지 눈으로 확인하는 증거.
- takeScreenshot: 00b_otp_keypad
# 6자리를 채우면 앱이 자동으로 확인한다(2026-09-30 수정). 예전에는 키패드가 確認 버튼을
# 거의 덮어 좌표 탭으로 우회해야 했는데, 그 우회를 없앴다.
# optional 탭은 자동 확인이 안 먹었을 때만 발동하는 안전망이다(발동하면 수정이 안 된 것).
- tapOn:
    text: "確認"
    optional: true

# 통지 프리퍼미션(기기 1회) → 나중에
- extendedWaitUntil:
    visible: "あとで設定する"
    timeout: 60000
- tapOn: "あとで設定する"

# ── 1) 홈 + 하단 탭 4개 ──────────────────────────────────────────────────
- repeat:
    times: 3
    commands:
      - runFlow:
          when:
            visible: "Dismiss"
          commands:
            - tapOn: "Dismiss"
- extendedWaitUntil:
    visible: "今日のまとめ"
    timeout: 60000
- assertVisible: "ホーム"
- assertVisible: "時間割"
- assertVisible: "掲示板"
- assertVisible: "マイページ"
- takeScreenshot: 01_home
- scroll
- takeScreenshot: 02_home_scrolled

# ── 2) 課題 모달 열기 → 닫기 ────────────────────────────────────────────
- scrollUntilVisible:
    element: "今日のまとめ"
    direction: UP
    optional: true
- repeat:
    times: 3
    commands:
      - runFlow:
          when:
            visible: "Dismiss"
          commands:
            - tapOn: "Dismiss"
      - runFlow:
          when:
            visible: "今日のまとめ"
          commands:
            - tapOn: ".*課題.*"
- takeScreenshot: 03_assignment_modal
# 닫기(✕)로 빠져나올 수 있어야 한다 — 모달 전환의 핵심 확인 항목
# ⚠️ 좌표 탭은 쓰지 않는다. 아이패드에서는 콘텐츠가 가운데 컬럼으로 모여
#    같은 비율이 빈 여백을 가리켰다(2026-09-30 실측 실패). 접근성 라벨로 누른다.
- tapOn: "閉じる"
- extendedWaitUntil:
    visible: "今日のまとめ"
    timeout: 20000
- takeScreenshot: 04_back_to_home

# ── 3) 時間割 ───────────────────────────────────────────────────────────
- tapOn: "時間割"
- runFlow:
    when:
      visible: "Dismiss"
    commands:
      - tapOn: "Dismiss"
- extendedWaitUntil:
    visible: ".*学期.*"
    timeout: 30000
- takeScreenshot: 05_timetable

# ── 4) 掲示板 ───────────────────────────────────────────────────────────
- tapOn: "掲示板"
- runFlow:
    when:
      visible: "Dismiss"
    commands:
      - tapOn: "Dismiss"
- extendedWaitUntil:
    visible: "掲示板"
    timeout: 30000
- takeScreenshot: 06_board

# ── 5) マイページ — 学校サイトの接続 / テスト通知 ───────────────────────
- tapOn: "マイページ"
- runFlow:
    when:
      visible: "Dismiss"
    commands:
      - tapOn: "Dismiss"
- extendedWaitUntil:
    visible: "マイページ"
    timeout: 30000
- takeScreenshot: 07_profile_top
- scrollUntilVisible:
    element: "学校サイトの接続"
    direction: DOWN
    timeout: 40000
- takeScreenshot: 08_profile_school_section
